<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title>

    <style>
        /* CSS Variables */
        :root {
            --brand: #2f5bea;
            --light: #eef2ff;
            --dark: #1b2440;
            --gap: 16px;
        }

        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: Georgia, serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding: var(--gap);
        }

        /* Element Selector */
        h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        /* ID Selector */
        #hero {
            background: var(--brand);
            color: white;
            text-align: center;
            padding: 32px var(--gap);
            border-radius: 10px;
        }

        /* Class Selector */
        .card {
            background: white;
            padding: var(--gap);
            margin-top: var(--gap);
            border-radius: 10px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th {
            background: var(--brand);
            color: white;
            text-align: left;
        }

        th,
        td {
            padding: 8px;
            border-bottom: 1px solid #ccd;
        }

        /* Input Styling */
        input {
            padding: 6px;
            margin: 4px 0;
        }

        /* Button Styling */
        button {
            background: var(--brand);
            color: white;
            border: 0;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Hero Section -->
    <div id="hero">
        <h1>Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </div>

    <!-- Upcoming Events -->
    <div class="card">
        <h2>Upcoming Events</h2>

        <table>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>

            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Lab 1</td>
            </tr>

            <tr>
                <td>Hackathon</td>
                <td>20 Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </table>
    </div>

    <!-- Registration Section -->
    <div class="card">
        <h2>Register</h2>

        <p>
            Name:
            <input type="text" placeholder="Saransh Bora">
        </p>

        <p>
            Email:
            <input type="email" placeholder="saranshbora@gmail.com">
        </p>

        <button type="button">Register</button>
    </div>

</body>

</html>
