<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab</title>

    <style>
        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #12203a;
        }

        /* Navbar: logo left, links right */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #12203a;
            color: white;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Button */
        .btn {
            background: #ffb703;
            border: 0;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 260px;
            padding: 16px;
            text-align: center;
            background: #2f5bea;
            color: white;
        }

        /* Course Cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 24px;
        }

        .card {
            flex: 1 1 200px;
            background: #eef2ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>CodeLab</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <button class="btn">Sign up</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Learn Web Development</h1>
        <p>Start from zero. Build real projects.</p>
        <button class="btn">Get started</button>
    </section>

    <!-- Courses Section -->
    <section class="cards" id="courses">

        <div class="card">
            <h3>HTML</h3>
            <p>Build the structure</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Make it beautiful</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Make it smart</p>
        </div>

        <div class="card">
            <h3>Git</h3>
            <p>Save your work</p>
        </div>

    </section>

</body>

</html>
